<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salto Chancho</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chancho">
<meta name="theme-color" content="#8FCBE4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#E4EFDF; --ink:#3A2433; --muted:#6A5873; --frame:#3A2433; --accent:#E07D98; --panel:rgba(255,255,255,.88);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1F1A26; --ink:#F4EAF1; --muted:#BBA9C6; --frame:#F4A6B8; --panel:rgba(46,34,56,.9); }
}
:root[data-theme="dark"]{ --bg:#1F1A26; --ink:#F4EAF1; --muted:#BBA9C6; --frame:#F4A6B8; --panel:rgba(46,34,56,.9); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display:flex; justify-content:center;
}
main{ width:100%; max-width:960px; padding:16px; display:flex; flex-direction:column; gap:12px; }
header{ display:flex; align-items:baseline; justify-content:space-between; gap:8px 20px; flex-wrap:wrap; }
h1{
  font-family:'Arial Rounded MT Bold', ui-rounded, 'Trebuchet MS', sans-serif;
  font-weight:400; font-size:clamp(1.9rem, 6vw, 2.8rem); line-height:1; margin:0;
}
.scores{ display:flex; gap:20px; }
.score{ display:flex; align-items:baseline; gap:6px; }
.score small{ color:var(--muted); font-weight:700; font-size:.9rem; }
.score b{ font-family:'Arial Rounded MT Bold', ui-rounded, 'Trebuchet MS', sans-serif; font-weight:400; font-size:1.35rem; font-variant-numeric:tabular-nums; }
.stage{
  position:relative; width:100%; border:3px solid var(--frame); border-radius:18px; overflow:hidden;
  background:#8FCBE4; cursor:pointer; touch-action:manipulation;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
}
.stage:focus-visible{ outline:4px solid var(--accent); outline-offset:3px; }
canvas{ display:block; width:100%; max-width:100%; }
.overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; padding:12px; }
.overlay.hidden{ display:none; }
.card{
  background:var(--panel); color:var(--ink); border:2px solid var(--frame); border-radius:14px;
  padding:14px 22px; max-width:30rem; text-align:center;
}
.card h2{ font-family:'Arial Rounded MT Bold', ui-rounded, 'Trebuchet MS', sans-serif; font-weight:400; margin:0 0 4px; font-size:clamp(1.4rem, 4.5vw, 2rem); }
.card p{ margin:0; font-size:clamp(.92rem, 2.6vw, 1.05rem); line-height:1.4; }
.help{ margin:0; color:var(--muted); font-size:.95rem; line-height:1.5; max-width:70ch; }
kbd{ font-family:inherit; font-weight:700; border:1.5px solid var(--muted); border-bottom-width:3px; border-radius:6px; padding:0 6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Salto Chancho</h1>
    <div class="scores">
      <div class="score"><small>Distancia</small><b id="score">0</b><small>m</small></div>
      <div class="score"><small>Récord</small><b id="best">0</b><small>m</small></div>
    </div>
  </header>

  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Juego Salto Chancho. Presiona espacio para saltar.">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">¿Listo para correr?</h2>
        <p id="ovText">Presiona espacio o toca la pantalla para empezar.</p>
      </div>
    </div>
  </div>

  <p class="help">Un solo botón: <kbd>Espacio</kbd>, <kbd>↑</kbd> o un toque en la pantalla. Un toque corto da un salto bajo; si lo mantienes, el salto es más alto. Los fardos dobles y las zanjas anchas piden salto alto.</p>
  <p class="help" id="offline"></p>
  <span class="sr" id="live" aria-live="polite"></span>
</main>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const live = document.getElementById('live');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Mundo lógico
  const H = 360, GROUND = 300, PX = 96;
  const G = 2600, JUMP_V = 620, HOLD_G = 0.6, BASE_SPEED = 300, MAX_EXTRA = 360;
  let W = 640, scale = 1;

  const C = {
    ink:'#3A2433', skyTop:'#8FCBE4', skyBot:'#DDF0E6', sun:'#FFE08A',
    hillFar:'#A9CF8E', hillNear:'#7DB565', grass:'#5E9E48', grassDark:'#4C8639',
    dirt:'#8C5B36', dirtDark:'#734828', pit:'#2C1F18', mud:'#5A3B26', mudHi:'#6E4A30',
    pink:'#F4A6B8', pinkDark:'#E07D98', snout:'#EB8DA6',
    shirt:'#F3C64B', denim:'#3E6DB3', denimDark:'#2F5590', boot:'#5A3A22',
    wood:'#B57D47', woodDark:'#8E5E31', hay:'#E8C25A', hayDark:'#C99A36', twine:'#A0522D', dust:'#C9A27A'
  };

  let best = 0;
  try { best = parseInt(localStorage.getItem('salto-chancho-best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  let state = 'ready', held = false, bufferT = 0, overT = 0, elapsed = 0, dist = 0, speed = BASE_SPEED;
  let obstacles = [], particles = [], clouds = [];
  let sinceSpawn = 0, nextGap = 520, spawned = 0, shake = 0;
  let farOff = 0, nearOff = 0, groundOff = 0, deathCause = '';
  const p = { y:GROUND, vy:0, grounded:true, coyote:0, run:0, falling:false, dead:false };

  // ---------- Tamaño ----------
  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 90, s: 0.7 + Math.random() * 0.7 });
  }
  function resize() {
    const cssW = stage.clientWidth;
    if (!cssW) return;
    let cssH = Math.min(cssW * 9 / 16, window.innerHeight - 200, 520);
    cssH = Math.max(cssH, 230);
    W = Math.round(Math.min(960, Math.max(420, cssW / cssH * H)));
    cssH = cssW * H / W;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = canvas.width / W;
    if (!clouds.length) initClouds();
  }
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  // ---------- Sonido ----------
  let actx = null;
  function beep(type, f0, f1, dur, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // ---------- Estado ----------
  function showOverlay(title, text) { ovTitle.textContent = title; ovText.textContent = text; overlay.classList.remove('hidden'); }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function reset() {
    obstacles = []; particles = [];
    sinceSpawn = 0; nextGap = W * 0.9; spawned = 0;
    elapsed = 0; dist = 0; speed = BASE_SPEED;
    Object.assign(p, { y:GROUND, vy:0, grounded:true, coyote:0, falling:false, dead:false });
    scoreEl.textContent = '0';
  }
  function start() { reset(); state = 'running'; hideOverlay(); live.textContent = ''; }

  function gameOver(cause) {
    state = 'over'; overT = 0; deathCause = cause; p.dead = true; held = false;
    if (cause === 'hit') { p.vy = -380; shake = reduceMotion ? 0 : 8; beep('sawtooth', 220, 70, 0.35, 0.05); }
    else beep('triangle', 400, 90, 0.45, 0.05);
    const sc = Math.floor(dist / 40);
    let record = false;
    if (sc > best) {
      best = sc; record = true;
      try { localStorage.setItem('salto-chancho-best', String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    const title = cause === 'hit' ? '¡Porrazo!' : '¡Al barro!';
    const text = `Recorriste ${sc} m.${record ? ' ¡Nuevo récord!' : ''} Salta para intentarlo de nuevo.`;
    showOverlay(title, text);
    live.textContent = `${title} ${text}`;
  }

  // ---------- Entrada (un solo botón) ----------
  function press() {
    held = true;
    if (state === 'ready') { start(); bufferT = 0.12; }
    else if (state === 'running') { bufferT = 0.12; }
    else if (state === 'over' && overT > 0.45) { start(); bufferT = 0.12; }
  }
  function release() { held = false; }

  const KEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'Enter']);
  window.addEventListener('keydown', e => {
    if (!KEYS.has(e.code)) return;
    e.preventDefault();
    if (e.repeat) return;
    press();
  });
  window.addEventListener('keyup', e => { if (KEYS.has(e.code)) { e.preventDefault(); release(); } });
  stage.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { stage.focus({ preventScroll:true }); } catch (err) {}
    press();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);

  // ---------- Obstáculos ----------
  function spawn() {
    const r = Math.random();
    let type;
    if (spawned < 3) type = r < 0.6 ? 'fence' : 'bale1';
    else type = r < 0.3 ? 'fence' : r < 0.53 ? 'bale1' : r < 0.76 ? 'bale2' : 'pit';
    let o;
    if (type === 'fence') o = { type, x:W + 20, w:40, h:38 };
    else if (type === 'bale1') o = { type, x:W + 20, w:46, h:34 };
    else if (type === 'bale2') o = { type, x:W + 20, w:46, h:66 };
    else {
      const w = Math.min(58 + Math.random() * 48 + (speed - BASE_SPEED) * 0.12, speed * 0.45);
      o = { type, x:W + 20, w, h:0 };
    }
    obstacles.push(o);
    spawned++;
    sinceSpawn = 0;
    nextGap = o.w + speed * 0.75 + 170 + Math.random() * 260;
  }

  function dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: -speed * 0.3 * Math.random() - 30, vy: -60 - Math.random() * 80, life: 0.4 + Math.random() * 0.2, r: 2 + Math.random() * 3 });
    }
  }

  // ---------- Actualización ----------
  function update(dt) {
    for (const c of clouds) {
      c.x -= (state === 'running' ? speed * 0.08 : 12) * dt * c.s;
      if (c.x < -80 * c.s) { c.x = W + 60; c.y = 30 + Math.random() * 90; }
    }

    if (state === 'running') {
      elapsed += dt;
      speed = BASE_SPEED + Math.min(MAX_EXTRA, elapsed * 8);
      const sp = p.falling ? 0 : speed;
      dist += sp * dt;
      farOff += sp * 0.15 * dt; nearOff += sp * 0.35 * dt; groundOff += sp * dt;
      scoreEl.textContent = Math.floor(dist / 40);

      for (const o of obstacles) o.x -= sp * dt;
      obstacles = obstacles.filter(o => o.x + o.w > -60);
      sinceSpawn += sp * dt;
      if (sinceSpawn >= nextGap) spawn();

      // Salto con tolerancias (coyote time y buffer)
      bufferT -= dt;
      if (p.grounded) p.coyote = 0.08; else p.coyote -= dt;
      if (bufferT > 0 && p.coyote > 0 && !p.falling) {
        p.vy = -JUMP_V; p.grounded = false; p.coyote = 0; bufferT = 0;
        beep('square', 320, 560, 0.12, 0.035);
        dust(PX - 6, GROUND, 5);
      }
      const gm = (held && p.vy < 0) ? HOLD_G : 1;
      p.vy += G * gm * dt;
      p.y += p.vy * dt;

      const overPit = obstacles.some(o => o.type === 'pit' && PX - 9 > o.x && PX + 9 < o.x + o.w);
      if (!p.falling && !overPit && p.y >= GROUND) {
        if (!p.grounded && p.vy > 250) dust(PX, GROUND, 6);
        p.y = GROUND; p.vy = 0; p.grounded = true;
      } else {
        p.grounded = false;
        if (overPit && p.y > GROUND + 6) p.falling = true;
      }
      if (p.falling && p.y > H + 70) { gameOver('pit'); return; }

      p.run += dt * speed / 26;

      const hb = { x: PX - 11, y: p.y - 60, w: 22, h: 58 };
      for (const o of obstacles) {
        if (o.type === 'pit') continue;
        const ob = { x: o.x + 4, y: GROUND - o.h + 3, w: o.w - 8, h: o.h - 3 };
        if (hb.x < ob.x + ob.w && hb.x + hb.w > ob.x && hb.y < ob.y + ob.h && hb.y + hb.h > ob.y) { gameOver('hit'); return; }
      }
    } else if (state === 'over') {
      overT += dt;
      if (deathCause === 'hit') { p.vy += G * dt; p.y = Math.min(p.y + p.vy * dt, GROUND); }
      else if (p.y < H + 80) { p.vy += G * dt; p.y += p.vy * dt; }
    }

    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
  }

  // ---------- Dibujo ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fillStroke(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || 2; ctx.strokeStyle = C.ink; ctx.stroke(); }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y - 8 * s, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 40 * s, y, 15 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x, y, 40 * s, 15 * s);
  }

  function drawHills(off, base, amp, freq, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-10, GROUND);
    for (let x = -10; x <= W + 10; x += 8) {
      const u = x + off;
      ctx.lineTo(x, base - Math.sin(u * freq) * amp - Math.sin(u * freq * 2.3 + 1.3) * amp * 0.4);
    }
    ctx.lineTo(W + 10, GROUND);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = C.dirt; ctx.fillRect(-10, GROUND, W + 20, H - GROUND + 10);
    ctx.fillStyle = C.grass; ctx.fillRect(-10, GROUND, W + 20, 9);
    ctx.fillStyle = C.grassDark; ctx.fillRect(-10, GROUND + 9, W + 20, 3);
    const step = 46, s = groundOff % step, base = Math.floor(groundOff / step);
    ctx.fillStyle = C.dirtDark;
    for (let i = -1; i < W / step + 2; i++) {
      const k = i + base, x = i * step - s;
      ctx.fillRect(x + (Math.abs(k * 13) % 20), GROUND + 22 + (Math.abs(k * 37) % 30), 6, 3);
    }
    ctx.fillStyle = C.grassDark;
    for (let i = -1; i < W / step + 2; i++) {
      const k = i + base, x = i * step - s + (Math.abs(k * 29) % 30);
      ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 3, GROUND - 6); ctx.lineTo(x + 6, GROUND); ctx.fill();
    }
  }

  function drawPit(o) {
    ctx.fillStyle = C.pit; ctx.fillRect(o.x, GROUND, o.w, H - GROUND + 10);
    ctx.fillStyle = C.mud; ctx.fillRect(o.x, H - 24, o.w, 30);
    ctx.fillStyle = C.mudHi;
    ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.3, H - 20, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.7, H - 16, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.grassDark;
    ctx.fillRect(o.x - 3, GROUND, 3, 14);
    ctx.fillRect(o.x + o.w, GROUND, 3, 14);
  }

  function drawFence(o) {
    const top = GROUND - o.h;
    rr(o.x, top + 8, o.w, 6, 2); fillStroke(C.wood);
    rr(o.x, top + 22, o.w, 6, 2); fillStroke(C.wood);
    for (const px of [o.x + 2, o.x + o.w - 10]) {
      ctx.beginPath();
      ctx.moveTo(px, GROUND); ctx.lineTo(px, top + 4); ctx.lineTo(px + 4, top); ctx.lineTo(px + 8, top + 4); ctx.lineTo(px + 8, GROUND);
      ctx.closePath(); fillStroke(C.woodDark);
    }
  }

  function drawBales(o) {
    const n = o.type === 'bale2' ? 2 : 1, bh = o.h / n;
    for (let i = 0; i < n; i++) {
      const y = GROUND - bh * (i + 1), x = o.x + (i ? 2 : 0), w = o.w - (i ? 4 : 0);
      rr(x, y, w, bh, 6); fillStroke(C.hay);
      ctx.strokeStyle = C.hayDark; ctx.lineWidth = 1.5;
      for (let j = 1; j < 4; j++) { ctx.beginPath(); ctx.moveTo(x + 5, y + bh * j / 4); ctx.lineTo(x + w - 5, y + bh * j / 4 + (j % 2 ? 2 : -2)); ctx.stroke(); }
      ctx.fillStyle = C.twine;
      ctx.fillRect(x + w * 0.3, y + 1, 3, bh - 2);
      ctx.fillRect(x + w * 0.68, y + 1, 3, bh - 2);
    }
  }

  function limb(x1, y1, x2, y2, w, col) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.ink; ctx.lineWidth = w + 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function leg(a, col) {
    const hipY = -22, fx = Math.sin(a) * 20, fy = hipY + Math.cos(a) * 20;
    limb(0, hipY, fx, fy, 8, col);
    ctx.beginPath(); ctx.ellipse(fx + 3, fy - 1, 6, 4, 0, 0, Math.PI * 2); fillStroke(C.boot, 1.8);
  }
  function arm(a, col) {
    const sx = 2, sy = -42, hx = sx + Math.sin(a) * 15, hy = sy + Math.cos(a) * 15;
    limb(sx, sy, hx, hy, 6, col);
    ctx.beginPath(); ctx.arc(hx, hy, 3.6, 0, Math.PI * 2); fillStroke(C.pink, 1.8);
  }

  function drawPlayer(x, y) {
    const air = !p.grounded && !(state === 'ready');
    const sw = (state === 'running' && p.grounded) ? Math.sin(p.run) : 0;
    ctx.save();
    ctx.translate(x, y);
    let rot = air ? Math.max(-0.15, Math.min(0.2, p.vy / 2600)) : 0;
    if (p.dead && deathCause === 'hit') rot = -0.35;
    ctx.rotate(rot);
    ctx.lineJoin = 'round';

    // cola enroscada
    ctx.strokeStyle = C.pinkDark; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-15, -33, 4, 0.3, Math.PI * 1.7); ctx.stroke();

    // extremidades traseras
    arm(air ? 2.8 : -sw * 0.8, '#D9AC34');
    leg(air ? 0.55 : -sw * 0.7, C.denimDark);

    // torso: camisa y jardinera
    rr(-11, -46, 22, 26, 7); fillStroke(C.shirt);
    rr(-11, -36, 22, 16, 4); fillStroke(C.denim);
    ctx.strokeStyle = C.denim; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(-5, -46); ctx.moveTo(6, -36); ctx.lineTo(5, -46); ctx.stroke();
    ctx.fillStyle = C.shirt;
    ctx.beginPath(); ctx.arc(-5.5, -36, 1.6, 0, Math.PI * 2); ctx.arc(5.5, -36, 1.6, 0, Math.PI * 2); ctx.fill();

    // extremidades delanteras
    leg(air ? -0.6 : sw * 0.7, C.denim);
    arm(air ? 2.4 : sw * 0.8, C.shirt);

    // cabeza de chancho
    const hx = 3, hy = -58;
    ctx.beginPath(); ctx.moveTo(hx - 10, hy - 7); ctx.lineTo(hx - 15, hy - 22); ctx.lineTo(hx - 1, hy - 13); ctx.closePath(); fillStroke(C.pinkDark);
    ctx.beginPath(); ctx.ellipse(hx, hy, 15, 14, 0, 0, Math.PI * 2); fillStroke(C.pink);
    ctx.beginPath(); ctx.moveTo(hx - 1, hy - 12); ctx.lineTo(hx + 3, hy - 26); ctx.lineTo(hx + 10, hy - 10); ctx.closePath(); fillStroke(C.pinkDark);
    // mejilla
    ctx.fillStyle = 'rgba(224,90,125,.35)';
    ctx.beginPath(); ctx.arc(hx + 2, hy + 6, 3.6, 0, Math.PI * 2); ctx.fill();
    // hocico
    ctx.beginPath(); ctx.ellipse(hx + 15, hy + 3, 6, 7.5, 0, 0, Math.PI * 2); fillStroke(C.snout);
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.ellipse(hx + 13.2, hy + 3, 1.5, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx + 17, hy + 3, 1.5, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    // boca
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(hx + 9, hy + 9, 3, 0.2, Math.PI * 0.8); ctx.stroke();
    // ojo
    if (p.dead) {
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx + 3, hy - 7); ctx.lineTo(hx + 9, hy - 1);
      ctx.moveTo(hx + 9, hy - 7); ctx.lineTo(hx + 3, hy - 1);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(hx + 6, hy - 4, 4, 0, Math.PI * 2); fillStroke('#FFFFFF', 1.5);
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(hx + 7.2, hy - 4, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function draw(now) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, C.skyTop); g.addColorStop(1, C.skyBot);
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, GROUND + 20);
    ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(W - 90, 70, 30, 0, Math.PI * 2); ctx.fill();
    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawHills(farOff, 238, 26, 0.006, C.hillFar);
    drawHills(nearOff, 268, 18, 0.011, C.hillNear);
    drawGround();
    for (const o of obstacles) if (o.type === 'pit') drawPit(o);
    for (const o of obstacles) { if (o.type === 'fence') drawFence(o); else if (o.type !== 'pit') drawBales(o); }

    // jugador (recortado dentro de la zanja si cae)
    ctx.save();
    if (p.falling) {
      ctx.beginPath();
      ctx.rect(-20, -20, W + 40, GROUND + 20);
      const pit = obstacles.find(o => o.type === 'pit' && PX > o.x && PX < o.x + o.w);
      if (pit) ctx.rect(pit.x, GROUND, pit.w, H);
      ctx.clip();
    }
    const bob = state === 'ready' ? Math.sin(now / 300) * 1.2 : 0;
    drawPlayer(PX, p.y + bob);
    ctx.restore();

    for (const q of particles) {
      ctx.globalAlpha = Math.max(0, q.life / 0.6);
      ctx.fillStyle = C.dust;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Bucle ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30;
    if (dt < 0) dt = 0;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      const el = document.getElementById('offline');
      if (el) el.textContent = 'Listo para jugar sin conexión.';
    }).catch(() => {});
  });
}
</script>
